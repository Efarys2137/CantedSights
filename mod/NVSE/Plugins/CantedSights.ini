[General]
; Virtual-key code that toggles canted aim. 0x56 = V (note: V is VATS in vanilla; rebind VATS or change this).
ToggleKey=0x56
; Virtual-key code treated as "aiming". 0x02 = right mouse button. Change if you rebound aim.
AimKey=0x02
; Seconds to blend into / out of the canted pose
BlendTime=0.15
; Start in canted mode (0/1)
StartCanted=0

[Pose]
; Roll of the weapon around its barrel axis, degrees. Flip the sign if it rolls the wrong way.
RollDegrees=45.0
; Shift of the weapon in the parent node space (game units)
OffsetX=0.0
OffsetY=0.0
OffsetZ=0.0

[Engine]
; Offset in PlayerCharacter to the first-person root NiNode (unverified default).
Node1stPersonOffset=0x0694
; Name of the node to rotate
WeaponNodeName=Weapon
; 1 = write CantedSights.log next to the DLL (leave on while testing)
Log=1
